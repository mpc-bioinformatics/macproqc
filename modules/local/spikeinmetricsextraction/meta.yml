# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "spikeinmetricsextraction"
description: Collect spike-in/reference peptide metrics (maximum XIC intensity, retention time, number of identifications) from extracted XICs and identifications, and store them in HDF5 format.
keywords:
  - proteomics
  - xic
  - spike-ins
  - HDF5
  - mass spectrometry
tools:
  - "macproqc_helpers":
      description: "Helper tools for the macproqc pipeline. This module uses the `collect-spikein-metrics` helper to collect spike-in/reference peptide metrics."
      homepage: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      documentation: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      tool_dev_url: "https://github.com/mpc-bioinformatics/macproqc-helpers"
      doi: "no DOI available"
      licence:
        - BSD-3-Clause

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - xic_json:
        type: file
        description: Extracted XICs in JSON format (as produced by THERMOXICEXTRACTION/BRUKERXICEXTRACTION)
        pattern: "*.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464" # JSON
    - identifications:
        type: file
        description: CSV file listing the identifications matched to spike-ins (as produced by XICEXTRACTIONCONFIG)
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
  - - spike_ins_table:
        type: file
        description: CSV file containing spike-in information
        pattern: "*.{csv}"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV

output:
  hdf5:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hdf5":
          type: file
          description: HDF5 file containing the spike-in metrics
          pattern: "*.hdf5"
          ontologies:
            - edam: "http://edamontology.org/format_3590" # HDF5
  versions_macproqc_helpers:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "macproqc_helpers":
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - macproqc_helpers:
          type: string
          description: The name of the tool
      - eval('macproqc-helpers --version | sed "s;^macproqc-helpers ;;"'):
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@di-hardt"
maintainers:
  - "@di-hardt"
